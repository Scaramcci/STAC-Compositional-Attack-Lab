experiment_id: mvp_online
dataset_version: mvp-v0.1
planner_type: fixed
conditions: [clean, single_entry, fixed_full, random_legal_full, rule_planner_full, llm_planner_full, full_minus_memory_write, full_minus_retrieval, llm_planner_full_defense_on]
task_limit: 2
seeds: [1]
max_turns: 12
max_tool_calls: 8
max_tokens: 4096
benign_interference_steps: 3
defense_enabled: false
network_enabled: false
models:
  planner:
    provider: fake
    model: fake-deterministic-v1
    temperature: 0.2
    max_output_tokens: 1200
    timeout_seconds: 60
  attacker:
