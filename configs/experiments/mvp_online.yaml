    model: fake-deterministic-v1
    temperature: 0.2
    max_output_tokens: 1200
    timeout_seconds: 60
  victim:
    provider: fake
    model: fake-deterministic-v1
    temperature: 0.0
    max_output_tokens: 1200
    timeout_seconds: 60
  judge:
    provider: fake
    model: fake-deterministic-v1
    temperature: 0.0
    max_output_tokens: 1200
    timeout_seconds: 60
  verifier:
    provider: fake
    model: fake-deterministic-v1
    temperature: 0.0
